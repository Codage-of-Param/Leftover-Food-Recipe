services:
  # Backend FastAPI Service (Free Tier)
  - type: web
    name: midnight-chefs-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # You will add your API keys (OpenAI, Supabase, etc.) securely on the Render Dashboard
